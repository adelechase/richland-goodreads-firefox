name: Publish Goodreads extension website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'updates.json'
      - 'site/download-template.html'
      - 'release.py'
      - 'tests/test_release_page.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate and test signed download page
        run: |
          python3 release.py build-page
          python3 -m unittest discover -s tests -p 'test_release_page.py'
          python3 release.py check-page
      - name: Commit generated page when signed release changes
        run: |
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Goodreads download page for signed extension release'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
