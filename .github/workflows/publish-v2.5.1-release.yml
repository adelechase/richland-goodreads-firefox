name: Publish v2.5.1 signed release

on:
  push:
    branches: [main]
    paths:
      - "release-assets/READY-v2.5.1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct signed XPI
        run: |
          cat release-assets/base64/part* | base64 --decode > richland-goodreads-firefox-v2.5.1-signed.xpi
          echo "6025d23a4c4dbd10fa7de645cbcd290e129928c792a65c8cfb6e70714ab4b34e  richland-goodreads-firefox-v2.5.1-signed.xpi" | sha256sum --check

      - name: Create release and upload signed XPI
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: richland-goodreads-firefox-v2.5.1-signed.xpi
        run: |
          if gh release view v2.5.1 >/dev/null 2>&1; then
            gh release upload v2.5.1 "$ASSET" --clobber
          else
            gh release create v2.5.1 "$ASSET" \
              --title "Richland Library on Goodreads v2.5.1" \
              --notes "Mozilla-signed Firefox XPI for self-hosted distribution."
          fi
